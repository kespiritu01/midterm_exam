<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="static/confirmation.css">
  </head>
  <body>
    <h1>Displaying Information</h1><br>
        <div class="container">
            <p><strong>Name: </strong> {{name}}</p>
            <p><strong>Email: </strong>{{email}}</p>
            <p><strong>Phone Number: </strong>{{phone}}</p>
            <p><strong>Message: </strong>{{message}}</p>
            <p><strong>Subject: </strong>{{final_subject}}</p>
            <p><strong>Preferred Contact Method: </strong>{{contact_method}}</p>
            <p><strong>Agreement Checkbox: </strong>{{agreement}}</p>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    </body>
</html>
