<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="static/styles.css">
  </head>
  <body>
    <h1>Contact Form</h1>
        <div class="container">
            <form action="http://localhost:5000/confirmation" method="POST">
                <label>Name</label>
                <input type="text" name="name" required><br><br>
                <label>Email</label>
                <input type="email" name="email" required><br><br>
                <label>Phone Number</label>
                <input type="number" name="phone_number" required><br><br>
                <label>Message</label><br>
                <textarea name="message" cols="25" rows="5"></textarea><br>
                <label>Subject</label><br>
                <select class="form-select">
                <option selected></option>
                <option value="1">General Inquiry</option>
                <option value="2">Support Request</option>
                <option value="3">Other</option>
                </select><br>
                <label>Preferred Contact Method</label><br><br>
                <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1" name="contact_method">
                <label class="form-check-label" for="inlineCheckbox1">Email</label>
                </div>
                <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="inlineCheckbox2" value="option2" name="contact_method">
                <label class="form-check-label" for="inlineCheckbox2">Phone</label>
                </div>
                <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="inlineCheckbox3" value="option3" name="contact_method">
                <label class="form-check-label" for="inlineCheckbox2">Both</label>
                </div>
                <br><br>
                <input type="checkbox" name="agreement" required> agree to terms and conditions
                <br><br>
                <button type="submit" value="submit" class="btn">Submit</button>
            </form>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  </body>
</html>
